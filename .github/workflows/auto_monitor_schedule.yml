name: Auto Monitor Schedule

on:
  schedule:
    - cron: "0 13 * * *" # 每日一次：UTC 13:00 = 北京时间 21:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    # 定位卡死（镜像/网络阻塞）时兜底，避免占满 6 小时额度
    timeout-minutes: 45
    env:
      NJU_USERNAME: ${{ secrets.NJU_USERNAME }}
      NJU_PASSWORD: ${{ secrets.NJU_PASSWORD }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
      EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache Selenium Manager drivers
      uses: actions/cache@v4
      with:
        path: ~/.cache/selenium
        key: ${{ runner.os }}-selenium-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-selenium-

    - name: Show disk usage before install
      run: df -h

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        # 固定为 3.11，确保 ddddocr==1.4.11 有可用轮子
        python-version: '3.11'

    - name: Install CJK fonts for matplotlib
      run: |
        # 只装体积最小的中文字体（~1.6MB）。以前还装 fonts-noto-cjk（115MB）+ chromium
        # 的 snap 壳，镜像源/ snap store 一卡就是十几分钟。
        # 浏览器不再用 apt 装：ubuntu-latest 自带 google-chrome，Selenium Manager
        # 会自动匹配 chromedriver（已缓存 ~/.cache/selenium）。
        sudo apt-get update -qq || true
        sudo apt-get install -y --no-install-recommends \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=30 \
          -o Acquire::https::Timeout=30 \
          fonts-wqy-microhei fonts-dejavu-core || true
        sudo fc-cache -f || true
        # 浏览器：runner 自带 google-chrome 时直接用，缺失也只告警不中断
        (google-chrome --version || google-chrome-stable --version) 2>/dev/null \
          || echo 'WARNING: no system chrome found; Selenium Manager will download Chrome for Testing'

    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt

    - name: Cleanup pip cache and temp files
      run: |
        python -m pip cache purge || true
        df -h

    - name: Run Auto Monitor (Linux)
      shell: bash
      run: |
        echo "Running Python wrapper"
        python3 src/run_workflow_wrapper.py

    - name: Build stats.json for web frontend
      run: python3 src/stats.py

    - name: Commit and push changes
      if: always()
      shell: bash
      env:
        GIT_UPDATE_TOKEN: ${{ secrets.GIT_UPDATE_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        branch=${GITHUB_REF##*/}
        echo "Current branch: $branch"

        # 提交 data/ 目录的变更（如果有）
        git add -A data/ || echo "no data/ changes"
        git commit -m "Auto update: data (run ${GITHUB_RUN_ID})" -q || echo "No data changes to commit"


        # 提交 docs/ 目录的变更（静态站点 + stats.json，如果有）
        git add -A docs/ || echo "no docs/ changes"
        git commit -m "Auto update: docs (run ${GITHUB_RUN_ID})" -q || echo "No docs changes to commit"

        # 使用 token 推送到当前分支
        git remote set-url origin https://x-access-token:${GIT_UPDATE_TOKEN}@github.com/${{ github.repository }}.git
        git push origin "HEAD:$branch" || echo "Push failed"

    - name: Show latest wrapper log
      if: always()
      shell: bash
      run: |
        echo "Logs dir content:";
        ls -lt logs || true
        latest=$(ls -t logs 2>/dev/null | head -n1 || true)
        if [ -n "$latest" ]; then
          echo "---- BEGIN latest log: $latest ----";
          # 输出整个日志文件而不限行数
          cat "logs/$latest" || true
          echo "---- END latest log ----";
        else
          echo "No log files found in ./logs"
        fi

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nju_electric_monitor-logs-${{ github.run_id }}
        path: |
          logs/**
